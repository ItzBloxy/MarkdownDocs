<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0B0B" />
    <title>MarkdownDocs</title>
    <script>
      // Apply the saved theme before first paint (written by src/context/ThemeContext.tsx)
      try {
        var t = JSON.parse(localStorage.getItem('markdowndocs.theme') || 'null')
        if (t) {
          var light = t.mode === 'light' || (t.mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.dataset.theme = light ? 'light' : 'dark'
          for (var k in t.vars || {}) document.documentElement.style.setProperty(k, t.vars[k])
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
